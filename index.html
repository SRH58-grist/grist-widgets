<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigramme Grist - Refonte</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bg:#f6f7fa;
  --card:#fff;
  --text:#20242c;
  --muted:#6b7280;
  --border:#d9dee7;
  --line:#7f8793;
  --accent:#323c79;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.toolbar{
  position:sticky;top:0;z-index:20;
  display:flex;gap:8px;align-items:end;flex-wrap:wrap;
  padding:10px 12px;background:#fff;border-bottom:1px solid var(--border)
}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)}
select,button{
  min-height:34px;border:1px solid var(--border);border-radius:7px;
  background:#fff;padding:5px 9px;font-size:13px;color:var(--text)
}
button{cursor:pointer}
.spacer{flex:1}
#status{padding:7px 12px;font-size:12px;color:var(--muted)}
#viewport{overflow:auto;padding:20px;min-height:calc(100vh - 92px)}
#org{position:relative;margin:0 auto}
#lines{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.node{
  position:absolute;z-index:2;
  width:170px;min-height:58px;
  padding:7px 8px;
  border:1px solid var(--border);border-radius:9px;
  background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.06)
}
.node.encadrement{border-top:4px solid var(--accent)}
.title{font-size:11px;font-weight:700;line-height:1.2}
.person{font-size:10.5px;font-weight:700;margin-top:4px}
.meta{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.status-badge{
  display:inline-block;margin-top:5px;padding:2px 6px;border-radius:999px;
  font-size:9px;font-weight:700;background:rgba(255,255,255,.72)
}
.node.renfort{background:#fff5e8;border-color:#d59a45}
.node.projet{background:#f5efff;border-color:#9274bd}
.node.apprenti{background:#eef8ef;border-color:#6f9f73}
.node.temporaire{background:#fff1f1;border-color:#bd7474}
.empty{
  max-width:650px;margin:70px auto;padding:20px;text-align:center;
  background:#fff;border:1px solid var(--border);border-radius:10px;color:var(--muted)
}
@media print{
  .toolbar,#status{display:none!important}
  body,#viewport{background:#fff}
  #viewport{padding:0;overflow:visible}
  .node{box-shadow:none}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="field">
    <label>Direction</label>
    <select id="direction"></select>
  </div>
  <div class="field">
    <label>Service</label>
    <select id="service"></select>
  </div>
  <div class="field">
    <label>Niveau de détail</label>
    <select id="detail">
      <option value="epure">Épuré</option>
      <option value="occupant" selected>Avec occupant</option>
      <option value="complet">Complet</option>
    </select>
  </div>
  <div class="spacer"></div>
  <button id="print">Imprimer / PDF</button>
</div>

<div id="status">En attente des données Grist…</div>
<div id="viewport"><div id="org"></div></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const NODE_W = 170;
  const NODE_H = 66;
  const X_GAP = 20;
  const Y_GAP = 48;
  const PAD = 18;

  let allRows = [];

  function text(v){
    if(v === null || v === undefined) return "";
    if(Array.isArray(v)) return v.filter(x => typeof x === "string").join(", ");
    return String(v);
  }

  function escapeHtml(v){
    return text(v).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    })[ch]);
  }

  function numberOrNull(v){
    if(v === null || v === undefined || v === "") return null;
    if(typeof v === "number" && Number.isFinite(v)) return v;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function bool(v){
    if(typeof v === "boolean") return v;
    if(typeof v === "number") return v !== 0;
    return ["true","oui","yes","1","x"].includes(text(v).toLowerCase());
  }

  function getRawRefId(raw){
    if(raw === null || raw === undefined || raw === "") return null;
    if(typeof raw === "number") return raw;
    if(Array.isArray(raw)){
      const nums = raw.filter(x => typeof x === "number");
      return nums.length ? nums[nums.length - 1] : null;
    }
    if(typeof raw === "object" && raw.id !== undefined){
      const n = Number(raw.id);
      return Number.isFinite(n) ? n : null;
    }
    const n = Number(raw);
    return Number.isFinite(n) ? n : null;
  }

  function uniqueSorted(values){
    return [...new Set(values.map(text).filter(Boolean))]
      .sort((a,b) => a.localeCompare(b,"fr",{numeric:true}));
  }

  function fillSelect(select, values, allLabel){
    const old = select.value;
    select.innerHTML = "";

    const first = document.createElement("option");
    first.value = "";
    first.textContent = allLabel;
    select.appendChild(first);

    for(const value of values){
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = value;
      select.appendChild(opt);
    }

    if([...select.options].some(o => o.value === old)){
      select.value = old;
    }
  }

  function refreshFilters(){
    fillSelect(
      $("direction"),
      uniqueSorted(allRows.map(r => r.Direction)),
      "Toutes"
    );

    const direction = $("direction").value;
    fillSelect(
      $("service"),
      uniqueSorted(
        allRows
          .filter(r => !direction || text(r.Direction) === direction)
          .map(r => r.Service)
      ),
      "Tous"
    );
  }

  function filteredRows(){
    const direction = $("direction").value;
    const service = $("service").value;
    const byId = new Map(allRows.map(r => [r.rowId, r]));

    const selected = allRows.filter(r => {
      if(direction && text(r.Direction) !== direction) return false;
      if(service && text(r.Service) !== service) return false;
      return true;
    });

    // Conserver les ancêtres nécessaires pour que les branches restent reliées.
    const keep = new Map(selected.map(r => [r.rowId, r]));

    for(const row of selected){
      let pid = row.parentId;
      let guard = 0;

      while(pid && byId.has(pid) && guard++ < 100){
        const parent = byId.get(pid);
        keep.set(parent.rowId, parent);
        pid = parent.parentId;
      }
    }

    return [...keep.values()];
  }

  function makeGraph(rows){
    const nodes = new Map();

    for(const row of rows){
      nodes.set(row.rowId, {
        ...row,
        children:[],
        logicalX:null,
        x:0,
        y:0
      });
    }

    const roots = [];

    for(const node of nodes.values()){
      if(node.parentId && node.parentId !== node.rowId && nodes.has(node.parentId)){
        nodes.get(node.parentId).children.push(node);
      }else{
        roots.push(node);
      }
    }

    const sortNodes = (a,b) =>
      text(a.Intitule).localeCompare(text(b.Intitule),"fr",{numeric:true});

    for(const node of nodes.values()) node.children.sort(sortNodes);
    roots.sort(sortNodes);

    return {nodes, roots};
  }

  function assignHorizontalPositions(roots){
    let cursor = 0;

    function walk(node){
      if(node.children.length === 0){
        node.logicalX = cursor++;
        return node.logicalX;
      }

      const xs = node.children.map(walk);
      node.logicalX = (Math.min(...xs) + Math.max(...xs)) / 2;
      return node.logicalX;
    }

    for(const root of roots){
      walk(root);
      cursor += 1;
    }
  }

  function preventSameLevelOverlap(nodes){
    const buckets = new Map();

    for(const node of nodes.values()){
      if(!buckets.has(node.level)) buckets.set(node.level,[]);
      buckets.get(node.level).push(node);
    }

    for(const bucket of buckets.values()){
      bucket.sort((a,b) =>
        (a.logicalX - b.logicalX) ||
        text(a.Intitule).localeCompare(text(b.Intitule),"fr")
      );

      for(let i=1; i<bucket.length; i++){
        if(bucket[i].logicalX <= bucket[i-1].logicalX){
          bucket[i].logicalX = bucket[i-1].logicalX + 1;
        }
      }
    }
  }

  function statusClass(status){
    const s = text(status).trim().toLowerCase();

    if(!s || s === "permanent" || s === "pérenne" || s === "perenne"){
      return "";
    }
    if(s.includes("renfort")) return "renfort";
    if(s.includes("projet")) return "projet";
    if(s.includes("apprenti")) return "apprenti";
    return "temporaire";
  }

  function cardContent(node){
    const detail = $("detail").value;
    const status = text(node.StatutPoste).trim();

    let html = `<div class="title">${escapeHtml(node.Intitule || "(poste sans intitulé)")}</div>`;

    if(detail !== "epure" && text(node.Occupant).trim()){
      html += `<div class="person">${escapeHtml(node.Occupant)}</div>`;
    }

    if(detail === "complet"){
      const bits = [];
      if(text(node.Categorie).trim()) bits.push(`Cat. ${escapeHtml(node.Categorie)}`);
      if(text(node.RIFSEEP).trim()) bits.push(`RIFSEEP ${escapeHtml(node.RIFSEEP)}`);
      if(bits.length){
        html += `<div class="meta">${bits.join(" • ")}</div>`;
      }
    }

    // Le statut non permanent ressort quel que soit le niveau de détail.
    if(status && status.toLowerCase() !== "permanent"){
      html += `<span class="status-badge">${escapeHtml(status)}</span>`;
    }

    return html;
  }

  function drawConnections(nodes){
    const svg = $("lines");
    svg.innerHTML = "";

    for(const node of nodes.values()){
      if(!node.parentId || !nodes.has(node.parentId)) continue;

      const parent = nodes.get(node.parentId);

      const x1 = parent.x + NODE_W / 2;
      const y1 = parent.y + NODE_H;
      const x2 = node.x + NODE_W / 2;
      const y2 = node.y;
      const mid = y1 + (y2 - y1) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", `M ${x1} ${y1} V ${mid} H ${x2} V ${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#7f8793");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
    }
  }

  function render(){
    const rows = filteredRows();

    if(rows.length === 0){
      $("status").textContent = "0 poste affiché";
      $("org").innerHTML = `<div class="empty">Aucun poste à afficher.</div>`;
      return;
    }

    const invalidLevel = rows.filter(r => r.level === null);
    if(invalidLevel.length){
      $("status").textContent = `${rows.length} postes reçus`;
      $("org").innerHTML =
        `<div class="empty">${invalidLevel.length} poste(s) n'ont pas de niveau d'organigramme exploitable.</div>`;
      return;
    }

    const {nodes, roots} = makeGraph(rows);
    assignHorizontalPositions(roots);
    preventSameLevelOverlap(nodes);

    const levels = [...new Set([...nodes.values()].map(n => n.level))].sort((a,b)=>a-b);
    const minLevel = Math.min(...levels);
    const maxLevel = Math.max(...levels);
    const maxLogicalX = Math.max(...[...nodes.values()].map(n => n.logicalX), 0);

    const width = Math.max(700, PAD*2 + (maxLogicalX+1)*(NODE_W+X_GAP));
    const height = PAD*2 + (maxLevel-minLevel+1)*(NODE_H+Y_GAP);

    const org = $("org");
    org.style.width = width + "px";
    org.style.height = height + "px";
    org.innerHTML = `<svg id="lines" width="${width}" height="${height}"></svg>`;

    for(const node of nodes.values()){
      node.x = PAD + node.logicalX * (NODE_W + X_GAP);
      node.y = PAD + (node.level - minLevel) * (NODE_H + Y_GAP);

      const div = document.createElement("div");
      div.className =
        "node" +
        (bool(node.Encadrement) ? " encadrement" : "") +
        (statusClass(node.StatutPoste) ? " " + statusClass(node.StatutPoste) : "");

      div.style.left = node.x + "px";
      div.style.top = node.y + "px";
      div.dataset.rowid = node.rowId;
      div.innerHTML = cardContent(node);
      org.appendChild(div);
    }

    drawConnections(nodes);

    const links = [...nodes.values()].filter(
      n => n.parentId && nodes.has(n.parentId) && n.parentId !== n.rowId
    ).length;

    $("status").textContent =
      `${nodes.size} poste${nodes.size>1?"s":""} • ${links} lien${links>1?"s":""} hiérarchique${links>1?"s":""} • niveaux ${levels.join(", ")}`;
  }

  $("direction").addEventListener("change", () => {
    const direction = $("direction").value;

    fillSelect(
      $("service"),
      uniqueSorted(
        allRows
          .filter(r => !direction || text(r.Direction) === direction)
          .map(r => r.Service)
      ),
      "Tous"
    );

    render();
  });

  $("service").addEventListener("change", render);
  $("detail").addEventListener("change", render);
  $("print").addEventListener("click", () => window.print());

  // Déclaration minimale et explicite des colonnes attendues.
  grist.ready({
    requiredAccess:"read table",
    columns:[
      {name:"Intitule", title:"Intitulé du poste", optional:false},
      {name:"Parent", title:"Supérieur hiérarchique", type:"Ref", optional:false},
      {name:"Niveau", title:"Niveau organigramme", optional:false},
      {name:"Direction", title:"Direction", optional:true},
      {name:"Service", title:"Service", optional:true},
      {name:"Occupant", title:"Occupant", optional:true},
      {name:"Categorie", title:"Catégorie", optional:true},
      {name:"RIFSEEP", title:"Groupe RIFSEEP", optional:true},
      {name:"StatutPoste", title:"Statut du poste", optional:true},
      {name:"Encadrement", title:"Poste d'encadrement ?", type:"Bool", optional:true}
    ]
  });

  grist.onRecords((records, mappings) => {
    try{
      if(!mappings){
        $("status").textContent = "Configure les colonnes du widget dans Grist.";
        return;
      }

      const mappedRows = [];
      const parentMapping = mappings.Parent;
      const parentColId = Array.isArray(parentMapping) ? parentMapping[0] : parentMapping;

      for(const record of records){
        const mapped = grist.mapColumnNames(record, {mappings});

        // mapColumnNames renvoie null tant que les colonnes obligatoires
        // ne sont pas toutes configurées.
        if(!mapped) continue;

        const rawParent = parentColId ? record[parentColId] : null;

        mappedRows.push({
          ...mapped,
          rowId:Number(record.id),
          parentId:getRawRefId(rawParent),
          level:numberOrNull(mapped.Niveau)
        });
      }

      allRows = mappedRows;

      if(allRows.length === 0){
        $("status").textContent =
          "Aucune donnée exploitable : vérifie les trois champs obligatoires.";
        $("org").innerHTML =
          `<div class="empty">Mappe au minimum : Intitulé du poste, Supérieur hiérarchique et Niveau organigramme.</div>`;
        return;
      }

      refreshFilters();
      render();

    }catch(err){
      console.error(err);
      $("status").textContent = "Erreur du widget";
      $("org").innerHTML =
        `<div class="empty"><b>Erreur :</b><br>${escapeHtml(err && err.message ? err.message : err)}</div>`;
    }
  });

})();
</script>
</body>
</html>
