<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigramme dynamique — Préfecture — Grist V2 stable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style id="app-style">
  :root{
    --bg:#f3f4f1;
    --paper:#ffffff;
    --ink:#1c1d1f;
    --ink-soft:#55565a;
    --line:#d8d8d2;
    --primary:#000091;
    --primary-soft:#e5e5f7;
    --accent:#a8722b;
    --cat-a:#1f3a5f;
    --cat-b:#3f6650;
    --cat-c:#8c5a2b;
    --cat-date:#5b3b66;
    --cat-na:#6b6b66;
    --status-dot:#c24b3a;
    --link:#aaaaa2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh;}

  header.app-header{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:14px 22px;
    align-items:center;
    z-index:20;
  }
  .brand{display:flex;flex-direction:column;margin-right:8px;min-width:220px;}
  .brand .eyebrow{font-size:12px;color:var(--primary);font-weight:600;}
  .brand h1{font-size:19px;margin:2px 0 0;font-weight:700;letter-spacing:-0.01em;}

  .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;flex:1;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}
  select, input[type="text"]{
    font-family:inherit;
    font-size:13.5px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--paper);
    color:var(--ink);
    min-width:150px;
  }
  input[type="range"]{width:150px;}
  .slider-value{font-size:12px;color:var(--ink-soft);}

  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:7px 13px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{opacity:0.92;color:#fff;}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  #main{position:relative;flex:1;overflow:hidden;}
  #chart-svg{width:100%;height:100%;display:block;cursor:grab;}
  #chart-svg:active{cursor:grabbing;}

  .link{fill:none;stroke:var(--link);stroke-width:1.6px;}

  .node-box{
    height:100%;
    background:var(--paper);
    border:1.6px solid var(--line);
    border-radius:var(--radius);
    padding:8px 10px 7px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    user-select:none;
  }
  .node-box:hover{border-color:var(--primary);}
  .node-box.synthetic{
    border-style:dashed;
    background:transparent;
    box-shadow:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:default;
  }
  .node-box.synthetic .node-title{color:var(--ink-soft);font-weight:600;}
  .node-box.non-permanent{border-style:dashed;}
  .node-box.is-manager{border-left:4px solid var(--accent);}

  .node-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .badge-cat{
    font-size:10.5px;
    font-weight:700;
    padding:1px 7px;
    border-radius:20px;
    color:#fff;
    letter-spacing:0.02em;
  }
  .cat-a .badge-cat{background:var(--cat-a);}
  .cat-b .badge-cat{background:var(--cat-b);}
  .cat-c .badge-cat{background:var(--cat-c);}
  .cat-date .badge-cat{background:var(--cat-date);}
  .cat-na .badge-cat{background:var(--cat-na);}
  .badge-manager{font-size:10px;color:var(--accent);font-weight:600;}
  .node-title{font-size:12.6px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .node-meta{font-size:10.8px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node-toggle{font-size:10px;color:var(--primary);font-weight:600;margin-top:1px;}

  .toggle-circle{fill:var(--paper);stroke:var(--primary);stroke-width:1.4px;cursor:pointer;}
  .toggle-label{font-size:13px;fill:var(--primary);font-weight:700;cursor:pointer;pointer-events:none;}

  .node.highlight .node-box{border-color:var(--status-dot);box-shadow:0 0 0 3px rgba(194,75,58,0.18);}

  #empty-state{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    flex-direction:column;gap:6px;color:var(--ink-soft);text-align:center;padding:20px;
  }
  #empty-state strong{color:var(--ink);font-size:15px;}

  #warnings{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    max-width:min(640px,90%);
    background:#fff7ec;border:1px solid #e7c98a;color:#5a4210;
    border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.5;
    z-index:15;display:none;
  }
  #warnings.show{display:block;}
  #warnings ul{margin:6px 0 0;padding-left:18px;max-height:120px;overflow:auto;}
  #warnings .dismiss{float:right;cursor:pointer;font-weight:700;color:#5a4210;margin-left:10px;}

  #legend{
    position:absolute;bottom:14px;left:14px;
    background:rgba(255,255,255,0.94);
    border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;
    font-size:11px;color:var(--ink-soft);
    display:flex;flex-direction:column;gap:5px;
    z-index:10;
  }
  #legend .row{display:flex;align-items:center;gap:6px;}
  #legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  aside#details-panel{
    position:absolute;top:0;right:0;bottom:0;width:340px;max-width:88vw;
    background:var(--paper);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .22s ease;
    z-index:25;overflow-y:auto;padding:18px 20px 30px;
  }
  aside#details-panel.open{transform:translateX(0);}
  #details-panel .close-btn{
    background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;
    float:right;line-height:1;
  }
  #details-panel h2{font-size:16px;margin:20px 0 2px;line-height:1.3;}
  #details-panel .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600;text-align:right;}


  /* Vue PDF créée indépendamment du zoom/pan à l'écran. */
  #print-area{display:none;}
  @media print{
    @page{size:A3 landscape;margin:8mm;}
    body{overflow:visible;background:#fff;}
    #app{display:none!important;}
    #print-area{display:block!important;background:#fff;}
    #print-area svg{display:block;width:100%;height:auto;overflow:visible;}
  }

  @media (max-width:760px){
    header.app-header{padding:10px 14px;}
    .brand{min-width:auto;}
    aside#details-panel{width:100%;max-width:100%;}
    #legend{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="brand">
      <span class="eyebrow">Ressources humaines</span>
      <h1>Organigramme dynamique</h1>
    </div>
    <div class="controls">
      <div class="field">
        <label for="direction-select">Direction</label>
        <select id="direction-select"></select>
      </div>
      <div class="field">
        <label for="service-select">Service</label>
        <select id="service-select"></select>
      </div>
      <div class="field">
        <label for="search-input">Rechercher un poste</label>
        <input type="text" id="search-input" placeholder="Nom du poste…">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="btn-group">
          <button class="btn" id="expand-all">Tout déplier</button>
          <button class="btn" id="collapse-all">Tout replier</button>
          <button class="btn" id="recenter">Recentrer</button>
          <button class="btn" id="export-pdf">Exporter en PDF</button>
        </div>
      </div>
    </div>
  </header>

  <div id="main">
    <svg id="chart-svg">
      <g class="zoom-layer">
        <g class="links-layer"></g>
        <g class="nodes-layer"></g>
      </g>
    </svg>

    <div id="warnings">
      <span class="dismiss" id="warnings-dismiss">&times;</span>
      <strong>Données à compléter</strong>
      <ul id="warnings-list"></ul>
    </div>

    <div id="legend">
      <div class="row"><span class="dot" style="background:var(--cat-a)"></span>Catégorie A</div>
      <div class="row"><span class="dot" style="background:var(--cat-b)"></span>Catégorie B</div>
      <div class="row"><span class="dot" style="background:var(--cat-c)"></span>Catégorie C</div>
      <div class="row"><span class="dot" style="background:var(--cat-date)"></span>Emploi DATE</div>
      <div class="row"><span style="width:10px;height:10px;border-left:3px solid var(--accent);display:inline-block"></span>Poste d'encadrement</div>
      <div class="row"><span style="width:10px;height:10px;border:1.4px dashed var(--ink-soft);display:inline-block;border-radius:3px"></span>Poste non permanent</div>
    </div>

    <div id="empty-state">
      <strong>Aucun poste à afficher</strong>
      <span>Modifiez les filtres Direction / Service pour voir l'organigramme.</span>
    </div>

    <aside id="details-panel">
      <button class="close-btn" id="close-details">&times;</button>
      <div id="details-content"></div>
    </aside>
  </div>
</div>
<div id="print-area"></div>

<script>
(function(){
  const state = {
    rows: [],
    nodesById: new Map(),
    warnings: [],
    direction: 'all',
    service: 'all',
    maxVisibleDepth: 999,
    root: null,
    maxDepthFound: 6
  };

  const NODE_W = 226, NODE_H = 84;
  const H_GAP = 34, V_GAP = 64;

  const svg = d3.select('#chart-svg');
  const zoomLayer = svg.select('.zoom-layer');
  const gLinks = zoomLayer.select('.links-layer');
  const gNodes = zoomLayer.select('.nodes-layer');

  const zoomBehavior = d3.zoom().scaleExtent([0.15, 2.2]).on('zoom', (event)=>{
    zoomLayer.attr('transform', event.transform);
  });
  svg.call(zoomBehavior).on('dblclick.zoom', null);

  const treeLayout = d3.tree().nodeSize([NODE_W + H_GAP, NODE_H + V_GAP]);

  function escapeHtml(str){
    return String(str==null? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function boolTrue(v){ return String(v||'').trim().toLowerCase() === 'true'; }

  function catClass(cat){
    const c = String(cat||'').trim().toUpperCase();
    if(c==='A') return 'cat-a';
    if(c==='B') return 'cat-b';
    if(c==='C') return 'cat-c';
    if(c==='DATE') return 'cat-date';
    return 'cat-na';
  }

  function cleanText(v){
    return String(v == null ? '' : v)
      .replace(/\u00a0/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function sameValue(a,b){
    return cleanText(a).localeCompare(cleanText(b),'fr',{sensitivity:'base'}) === 0;
  }

  function cleanRow(row){
    const out = {};
    Object.entries(row || {}).forEach(([k,v])=>{
      const key = String(k).replace(/^\uFEFF/, '').trim();
      out[key] = typeof v === 'string' ? v.trim() : v;
    });
    return out;
  }

  function loadRows(rows){
    state.rows = (rows || [])
      .map(cleanRow)
      .filter(r => cleanText(r['ID_Poste']));

    buildHierarchy();
    populateDirectionOptions();
    document.getElementById('search-input').value = '';
    applyFilterAndRender(true);
  }

  function loadData(csvText){
    const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    loadRows(parsed.data);
  }

  function buildHierarchy(){
    state.nodesById = new Map();

    const labelToIds = new Map();
    const rowIdToPostId = new Map();

    state.rows.forEach(r=>{
      const id = cleanText(r['ID_Poste']);
      state.nodesById.set(id, {id, row:r, childIds:[], parentId:null});

      const rowId = Number(r.__rowId);
      if(Number.isFinite(rowId)) rowIdToPostId.set(rowId, id);

      const label = cleanText(r['Libellé_poste']);
      if(label){
        if(!labelToIds.has(label)) labelToIds.set(label, []);
        labelToIds.get(label).push(id);
      }
    });

    state.warnings = [];
    const flaggedAmbiguous = new Set();

    state.nodesById.forEach(node=>{
      // Priorité au rowId brut de la Ref Grist.
      const rawParentRowId = Number(node.row.__parentRowId);
      if(Number.isFinite(rawParentRowId) && rowIdToPostId.has(rawParentRowId)){
        const parentId = rowIdToPostId.get(rawParentRowId);
        if(parentId !== node.id && state.nodesById.has(parentId)){
          node.parentId = parentId;
          state.nodesById.get(parentId).childIds.push(node.id);
          return;
        }
      }

      // Repli pour un CSV : rattachement par libellé du supérieur.
      const sup = cleanText(node.row['Sup_hiérarchique']);
      if(!sup) return;

      const candidates = (labelToIds.get(sup)||[]).filter(cid=>cid!==node.id);

      if(candidates.length===0){
        state.warnings.push(
          'Supérieur introuvable « ' + escapeHtml(sup) +
          ' » pour le poste « ' + escapeHtml(node.row['Libellé_poste']) +
          ' » (' + escapeHtml(node.id) + '). Ce poste est affiché comme racine.'
        );
        return;
      }

      if(candidates.length>1 && !flaggedAmbiguous.has(sup)){
        flaggedAmbiguous.add(sup);
        state.warnings.push(
          'L’intitulé « ' + escapeHtml(sup) +
          ' » correspond à ' + candidates.length +
          ' postes différents : le rattachement a pris le premier trouvé.'
        );
      }

      node.parentId = candidates[0];
      state.nodesById.get(candidates[0]).childIds.push(node.id);
    });

    renderWarnings();
  }

  function renderWarnings(){
    const box = document.getElementById('warnings');
    const list = document.getElementById('warnings-list');
    if(state.warnings.length===0){ box.classList.remove('show'); list.innerHTML=''; return; }
    list.innerHTML = state.warnings.slice(0,12).map(w=>'<li>'+w+'</li>').join('');
    if(state.warnings.length>12){
      list.innerHTML += '<li>… et ' + (state.warnings.length-12) + ' autre(s) alerte(s).</li>';
    }
    box.classList.add('show');
  }

  function setSelectOptions(select, values, firstLabel){
    const old = select.value;
    select.innerHTML = '';

    const first = document.createElement('option');
    first.value = 'all';
    first.textContent = firstLabel;
    select.appendChild(first);

    values.forEach(v=>{
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });

    select.value = [...select.options].some(o=>o.value===old) ? old : 'all';
  }

  function populateDirectionOptions(){
    const directions = [...new Set(
      state.rows.map(r=>cleanText(r['DIRECTION'])).filter(Boolean)
    )].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'}));

    const sel = document.getElementById('direction-select');
    setSelectOptions(sel, directions, 'Toute la structure');
    state.direction = sel.value || 'all';
    populateServiceOptions();
  }

  function populateServiceOptions(){
    const sel = document.getElementById('service-select');

    let source = state.rows;
    if(state.direction !== 'all'){
      source = source.filter(r=>sameValue(r['DIRECTION'], state.direction));
    }

    const services = [...new Set(
      source.map(r=>cleanText(r['SERVICE'])).filter(Boolean)
    )].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'}));

    setSelectOptions(sel, services, 'Tous les services');
    state.service = sel.value || 'all';
  }

  function filterLabel(){
    if(state.direction==='all') return 'Ensemble de la structure';
    if(state.service==='all') return state.direction;
    return state.direction + ' — ' + state.service;
  }

  function getFilteredIds(){
    const matched = new Set();

    state.nodesById.forEach((node,id)=>{
      const r = node.row;

      if(state.direction !== 'all' && !sameValue(r['DIRECTION'], state.direction)) return;
      if(state.service !== 'all' && !sameValue(r['SERVICE'], state.service)) return;

      matched.add(id);
    });

    // Garder les ancêtres pour conserver les traits hiérarchiques.
    const ids = new Set(matched);

    matched.forEach(id=>{
      let current = state.nodesById.get(id);
      let guard = 0;

      while(current && current.parentId && guard++ < 100){
        const parentId = current.parentId;

        // Dans une vue Direction / Service, le Préfet n'est pas répété.
        if(
          (state.direction !== 'all' || state.service !== 'all') &&
          cleanText(parentId).toUpperCase() === 'PREFET-01'
        ){
          break;
        }

        ids.add(parentId);
        current = state.nodesById.get(parentId);
      }
    });

    return ids;
  }

  function buildDisplayTree(){
    const ids = getFilteredIds();
    if(ids.size===0) return null;
    const rootIds = [...ids].filter(id=>{
      const p = state.nodesById.get(id).parentId;
      return !p || !ids.has(p);
    });
    function toDatum(id, visited){
      if(visited.has(id)) return null;
      visited.add(id);
      const node = state.nodesById.get(id);
      const children = node.childIds
        .filter(cid=>ids.has(cid))
        .map(cid=>toDatum(cid, visited))
        .filter(Boolean);
      return {id: node.id, row: node.row, children: children.length? children : undefined};
    }
    if(rootIds.length===1){
      return toDatum(rootIds[0], new Set());
    }
    return {
      id: '__synthetic_root__',
      synthetic: true,
      row: {'Libellé_poste': filterLabel()},
      children: rootIds.map(id=>toDatum(id, new Set())).filter(Boolean)
    };
  }

  function computeMaxDepth(datum){
    let max = 0;
    (function walk(d, depth){
      max = Math.max(max, depth);
      (d.children||[]).forEach(c=>walk(c, depth+1));
    })(datum, 0);
    return max;
  }

  function applyFilterAndRender(resetCollapse){
    const datum = buildDisplayTree();
    const empty = document.getElementById('empty-state');

    if(!datum){
      empty.style.display = 'flex';
      gLinks.selectAll('*').remove();
      gNodes.selectAll('*').remove();
      return;
    }

    empty.style.display = 'none';
    state.maxDepthFound = Math.max(1, computeMaxDepth(datum));
    state.maxVisibleDepth = 999;

    // Toujours tout afficher : plus de profondeur masquée au chargement.
    render(datum, false);
    requestAnimationFrame(recenter);
  }

  function render(datum, resetCollapse){
    const rootH = d3.hierarchy(datum, d=>d.children);
    rootH.each(d=>{ d.id = d.data.id; });

    // Si l'utilisateur a volontairement replié une branche avec +/-,
    // on conserve cet état lors d'un simple rerender.
    if(!resetCollapse && state.root){
      const prevCollapsed = new Set();
      state.root.each(d=>{ if(d._children) prevCollapsed.add(d.id); });
      rootH.each(d=>{
        if(prevCollapsed.has(d.id) && d.children){
          d._children = d.children;
          d.children = null;
        }
      });
    }

    state.root = rootH;
    update();
  }

  function countDirect(d){
    return (d.children? d.children.length : 0) + (d._children? d._children.length : 0);
  }

  function nodeHTML(d){
    const r = d.data.row;
    if(d.data.synthetic){
      return '<div class="node-box synthetic"><div class="node-title">'+escapeHtml(r['Libellé_poste'])+'</div></div>';
    }
    const enc = boolTrue(r['Poste_encadrement']);
    const statut = (r['Statut poste']||'').trim();
    const cat = (r['Catégorie']||'').trim();
    const nonPerm = statut && statut.toLowerCase()!=='permanent';
    const direct = countDirect(d);
    return '<div class="node-box '+catClass(cat)+(enc?' is-manager':'')+(nonPerm?' non-permanent':'')+'">' +
      '<div class="node-top"><span class="badge-cat">'+escapeHtml(cat||'—')+'</span>' +
      (enc? '<span class="badge-manager">Encadrement</span>':'') + '</div>' +
      '<div class="node-title">'+escapeHtml(r['Libellé_poste']||'')+'</div>' +
      '<div class="node-meta">'+escapeHtml(r['SERVICE']||'')+(nonPerm? ' · '+escapeHtml(statut):'')+'</div>' +
      (direct>0? '<div class="node-toggle">'+direct+' rattaché'+(direct>1?'s':'')+'</div>' : '') +
      '</div>';
  }

  function update(){
    const nodes = state.root.descendants();
    const links = state.root.links();
    treeLayout(state.root);

    // Connecteurs orthogonaux : vertical -> horizontal -> vertical.
    const linkGen = ({source, target})=>{
      const midY = source.y + (target.y - source.y) / 2;
      return `M${source.x},${source.y} V${midY} H${target.x} V${target.y}`;
    };

    const link = gLinks.selectAll('path.link').data(links, d=>d.target.id);
    link.exit().remove();
    link.enter().append('path').attr('class','link')
      .merge(link)
      .transition().duration(260)
      .attr('d', linkGen);

    const node = gNodes.selectAll('g.node').data(nodes, d=>d.id);
    node.exit().remove();

    const nodeEnter = node.enter().append('g')
      .attr('class','node')
      .attr('transform', d=>'translate('+d.x+','+d.y+')')
      .attr('tabindex', 0);

    nodeEnter.append('foreignObject')
      .attr('x', -NODE_W/2).attr('y', -NODE_H/2)
      .attr('width', NODE_W).attr('height', NODE_H)
      .append('xhtml:div')
      .attr('xmlns','http://www.w3.org/1999/xhtml')
      .on('click', function(event, d){ openDetails(d); });

    nodeEnter.append('circle')
      .attr('class','toggle-circle')
      .attr('cy', NODE_H/2)
      .attr('r', 10)
      .on('click', function(event, d){ event.stopPropagation(); toggleNode(d); });

    nodeEnter.append('text')
      .attr('class','toggle-label')
      .attr('y', NODE_H/2 + 4)
      .attr('text-anchor','middle')
      .on('click', function(event, d){ event.stopPropagation(); toggleNode(d); });

    const merged = nodeEnter.merge(node);

    merged.transition().duration(260)
      .attr('transform', d=>'translate('+d.x+','+d.y+')');

    merged.select('foreignObject > div')
      .html(d=>nodeHTML(d));

    merged.select('circle.toggle-circle')
      .style('display', d=> (d.children||d._children) ? null : 'none');

    merged.select('text.toggle-label')
      .style('display', d=> (d.children||d._children) ? null : 'none')
      .text(d=> d.children? '–' : '+');

    merged.classed('highlight', d=> d.__highlight === true);
  }

  function toggleNode(d){
    if(d.children){ d._children = d.children; d.children = null; }
    else if(d._children){ d.children = d._children; d._children = null; }
    update();
  }

  function collapseAllExceptRoot(){
    state.root.each(d=>{
      if(d.depth>=1 && d.children){ d._children = d.children; d.children = null; }
    });
    update();
  }

  function expandAll(){
    state.root.each(d=>{
      if(d._children){ d.children = d._children; d._children = null; }
    });
    update();
  }

  function recenter(){
    const bbox = gNodes.node().getBBox();
    if(!bbox.width || !bbox.height) return;
    const svgNode = svg.node();
    const w = svgNode.clientWidth, h = svgNode.clientHeight;
    const pad = 60;
    const scale = Math.max(0.18, Math.min(1.05, Math.min((w-pad)/bbox.width, (h-pad)/bbox.height)));
    const tx = w/2 - scale*(bbox.x + bbox.width/2);
    const ty = pad/1.5 - scale*bbox.y;
    svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
  }

  function openDetails(d){
    if(d.data.synthetic) return;
    const r = d.data.row;
    const panel = document.getElementById('details-panel');
    const content = document.getElementById('details-content');
    const rows = [
      ['Direction', r['DIRECTION']],
      ['Service', r['SERVICE']],
      ['Identifiant', r['ID_Poste']],
      ['Supérieur hiérarchique', r['Sup_hiérarchique'] || '—'],
      ['Poste d’encadrement', boolTrue(r['Poste_encadrement']) ? 'Oui' : 'Non'],
      ['Niveau organigramme', r['Niv_organigramme'] || '—'],
      ['Catégorie', r['Catégorie'] || '—'],
      ['RIFSEEP', r['RIFSEEP'] || '—'],
      ['NBI', r['NBI'] || '—'],
      ['Poste budgétaire', boolTrue(r['Poste budgétaire']) ? 'Oui' : 'Non'],
      ['Statut du poste', r['Statut poste'] || '—'],
      ['Nom', r['Occupant_Nom'] || '—'],
      ['Prénom', r['Occupant_Prenom'] || '—'],
      ['Statut de l’agent', r['Occupant_Statut'] || '—'],
      ['Contractuel', boolTrue(r['Occupant_Contractuel']) ? 'Oui' : 'Non'],
      ['Début du contrat', r['Occupant_Debut_contrat'] || '—'],
      ['Postes rattachés', countDirect(d)]
    ];
    content.innerHTML = '<h2>'+escapeHtml(r['Libellé_poste'])+'</h2>' +
      '<div class="sub">'+escapeHtml(r['ID_Poste'])+'</div>' +
      rows.map(([k,v])=>'<div class="detail-row"><span class="k">'+escapeHtml(k)+'</span><span class="v">'+escapeHtml(v)+'</span></div>').join('');
    panel.classList.add('open');
  }

  document.getElementById('close-details').addEventListener('click', ()=>{
    document.getElementById('details-panel').classList.remove('open');
  });

  document.getElementById('direction-select').addEventListener('change', function(){
    state.direction = this.value || 'all';
    populateServiceOptions();
    state.service = 'all';
    document.getElementById('service-select').value = 'all';
    applyFilterAndRender(true);
  });
  document.getElementById('service-select').addEventListener('change', function(){
    state.service = this.value || 'all';
    applyFilterAndRender(true);
  });
  document.getElementById('expand-all').addEventListener('click', expandAll);
  document.getElementById('collapse-all').addEventListener('click', collapseAllExceptRoot);
  document.getElementById('recenter').addEventListener('click', recenter);
  document.getElementById('warnings-dismiss').addEventListener('click', ()=>{
    document.getElementById('warnings').classList.remove('show');
  });

  document.getElementById('search-input').addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const term = this.value.trim().toLowerCase();
    if(!term) return;
    let found = null;
    state.root.each(d=>{
      if(!found && !d.data.synthetic && (d.data.row['Libellé_poste']||'').toLowerCase().includes(term)){
        found = d;
      }
    });
    state.root.each(d=>{ d.__highlight = false; });
    if(!found){
      alert('Aucun poste trouvé dans la vue actuelle pour « ' + this.value + ' ». Essayez avec un autre filtre Direction/Service.');
      return;
    }
    let p = found.parent;
    while(p){ if(p._children){ p.children = p._children; p._children = null; } p = p.parent; }
    found.__highlight = true;
    update();
    requestAnimationFrame(()=>{
      const svgNode = svg.node();
      const w = svgNode.clientWidth, h = svgNode.clientHeight;
      const scale = 0.85;
      const tx = w/2 - scale*found.x;
      const ty = h/2 - scale*found.y;
      svg.transition().duration(320).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
      setTimeout(()=>{ found.__highlight=false; update(); }, 2600);
    });
  });

  function exportSelectedViewToPdf(){
    if(!state.root) return;

    // Construire une copie entièrement dépliée de la vue FILTRÉE actuelle.
    const datum = buildDisplayTree();
    if(!datum) return;

    const printRoot = d3.hierarchy(datum, d=>d.children);
    treeLayout(printRoot);

    const nodes = printRoot.descendants();
    const links = printRoot.links();

    const minX = d3.min(nodes, d=>d.x) - NODE_W/2 - 25;
    const maxX = d3.max(nodes, d=>d.x) + NODE_W/2 + 25;
    const minY = d3.min(nodes, d=>d.y) - NODE_H/2 - 25;
    const maxY = d3.max(nodes, d=>d.y) + NODE_H/2 + 25;
    const width = Math.max(1, maxX-minX);
    const height = Math.max(1, maxY-minY);

    const area = d3.select('#print-area');
    area.html('');

    const ps = area.append('svg')
      .attr('xmlns','http://www.w3.org/2000/svg')
      .attr('viewBox', `${minX} ${minY} ${width} ${height}`)
      .attr('preserveAspectRatio','xMidYMin meet');

    const pg = ps.append('g');

    pg.selectAll('path.link')
      .data(links)
      .enter()
      .append('path')
      .attr('class','link')
      .attr('d', ({source,target})=>{
        const midY = source.y + (target.y-source.y)/2;
        return `M${source.x},${source.y} V${midY} H${target.x} V${target.y}`;
      });

    const pn = pg.selectAll('g.node')
      .data(nodes)
      .enter()
      .append('g')
      .attr('class','node')
      .attr('transform', d=>`translate(${d.x},${d.y})`);

    pn.append('foreignObject')
      .attr('x', -NODE_W/2)
      .attr('y', -NODE_H/2)
      .attr('width', NODE_W)
      .attr('height', NODE_H)
      .append('xhtml:div')
      .attr('xmlns','http://www.w3.org/1999/xhtml')
      .html(d=>nodeHTML(d));

    // Le navigateur ouvre sa boîte d'impression : choisir "Enregistrer au format PDF".
    setTimeout(()=>window.print(), 80);
  }

  document.getElementById('export-pdf').addEventListener('click', exportSelectedViewToPdf);

  window.addEventListener('resize', ()=>{ requestAnimationFrame(recenter); });

  grist.ready({
    requiredAccess:'read table',
    columns:[
      {name:'IDPoste', title:'ID du poste', optional:false},
      {name:'Libelle', title:'Intitulé du poste', optional:false},
      {name:'Parent', title:'Supérieur hiérarchique', type:'Ref', optional:false},
      {name:'Direction', title:'Direction', optional:true},
      {name:'Service', title:'Service', optional:true},
      {name:'Encadrement', title:'Poste d’encadrement ?', type:'Bool', optional:true},
      {name:'Niveau', title:'Niveau organigramme', optional:true},
      {name:'Categorie', title:'Catégorie', optional:true},
      {name:'RIFSEEP', title:'RIFSEEP', optional:true},
      {name:'NBI', title:'NBI', optional:true},
      {name:'PosteBudgetaire', title:'Poste budgétaire', type:'Bool', optional:true},
      {name:'StatutPoste', title:'Statut du poste', optional:true},
      {name:'OccupantNom', title:'Occupant — Nom', optional:true},
      {name:'OccupantPrenom', title:'Occupant — Prénom', optional:true},
      {name:'OccupantStatut', title:'Occupant — Statut', optional:true},
      {name:'OccupantContractuel', title:'Occupant — Contractuel ?', type:'Bool', optional:true},
      {name:'OccupantDebutContrat', title:'Occupant — Début du contrat', optional:true}
    ]
  });

  grist.onRecords((records, mappings)=>{
    try{
      if(!mappings) return;

      const parentMapping = mappings.Parent;
      const parentColId = Array.isArray(parentMapping) ? parentMapping[0] : parentMapping;

      const rows = records.map(record=>{
        const m = grist.mapColumnNames(record, {mappings});
        if(!m) return null;

        let rawParent = parentColId ? record[parentColId] : null;
        if(Array.isArray(rawParent)){
          const nums = rawParent.filter(x=>typeof x==='number');
          rawParent = nums.length ? nums[nums.length-1] : null;
        }

        return {
          'ID_Poste': m.IDPoste,
          'Libellé_poste': m.Libelle,
          'Sup_hiérarchique': m.Parent,
          'DIRECTION': m.Direction,
          'SERVICE': m.Service,
          'Poste_encadrement': m.Encadrement,
          'Niv_organigramme': m.Niveau,
          'Catégorie': m.Categorie,
          'RIFSEEP': m.RIFSEEP,
          'NBI': m.NBI,
          'Poste budgétaire': m.PosteBudgetaire,
          'Statut poste': m.StatutPoste,
          'Occupant_Nom': m.OccupantNom,
          'Occupant_Prenom': m.OccupantPrenom,
          'Occupant_Statut': m.OccupantStatut,
          'Occupant_Contractuel': m.OccupantContractuel,
          'Occupant_Debut_contrat': m.OccupantDebutContrat,
          '__rowId': record.id,
          '__parentRowId': rawParent
        };
      }).filter(Boolean);

      loadRows(rows);
    }catch(err){
      console.error(err);
      alert('Erreur de lecture des données Grist : ' + (err && err.message ? err.message : err));
    }
  });

})();
</script>
